# /etc/ssh/sshd_config.d/50-roguemoji.conf
#
# Lets anyone `ssh roguemoji@host` (password in banner.txt) and play, and do
# nothing else. Every other account keeps the global settings.

Match User roguemoji
    # The published password. Turn it on here even if it's off globally.
    PasswordAuthentication yes
    PermitEmptyPasswords no
    MaxAuthTries 3
    Banner /opt/roguemoji/banner.txt

    # Whatever the client asks to run (a command, sftp, scp), it gets the game.
    ForceCommand /opt/roguemoji/roguemoji-session
    PermitTTY yes
    MaxSessions 1

    # No tunnels of any kind: TCP, agent, X11, Unix sockets.
    DisableForwarding yes
    PermitTunnel no
    PermitUserRC no

    # Drop dead connections after about three minutes.
    ClientAliveInterval 60
    ClientAliveCountMax 3

# End the Match block so nothing that follows (sshd_config itself includes this
# directory near its top) applies only to roguemoji.
Match all
