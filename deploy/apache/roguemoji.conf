# Add inside the TLS <VirtualHost *:443> block for your site, above any
# catch-all ProxyPass or RewriteRule (Apache uses the first ProxyPass that
# matches). Browser players go to https://<host>/roguemoji/play/ and Apache
# passes the websocket through to ttyd.
#
# Needs mod_proxy and mod_proxy_http (a2enmod proxy proxy_http) and Apache
# 2.4.47 or newer for upgrade=websocket.

RedirectMatch 301 ^/roguemoji/play$ /roguemoji/play/

# A player can sit and think; don't cut the websocket after Apache's 60 s.
ProxyPass        /roguemoji/play/ http://127.0.0.1:7681/roguemoji/play/ upgrade=websocket timeout=3600
ProxyPassReverse /roguemoji/play/ http://127.0.0.1:7681/roguemoji/play/
ProxyPreserveHost On
