# /etc/tmpfiles.d/roguemoji.conf
#
# The folder for saved runs, private to the roguemoji account. Saves nobody has
# come back to for @DAYS@ days are deleted by systemd-tmpfiles-clean, which runs
# daily. make fills in @DAYS@ from SAVE_DAYS. The leaderboard lives here too and
# is never cleared.
d /var/lib/roguemoji/saves 0700 roguemoji roguemoji @DAYS@d
x /var/lib/roguemoji/saves/scores.jsonl
